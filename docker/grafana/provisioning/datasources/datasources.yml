# ════════════════════════════════════════════════════════════════
# Grafana Datasource Provisioning
# ════════════════════════════════════════════════════════════════
# Auto-provisions Prometheus as the default datasource.
# No manual setup needed — Grafana picks this up on first boot.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
