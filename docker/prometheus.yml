# ════════════════════════════════════════════════════════════════
# Prometheus Configuration — Sales Follow-Up Agent
# ════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s       # Scrape targets every 15 seconds
  evaluation_interval: 15s   # Evaluate rules every 15 seconds
  scrape_timeout: 10s

# ── Scrape Targets ─────────────────────────────────────────────
scrape_configs:

  # FastAPI application metrics
  - job_name: "sales-followup-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "api"
          environment: "production"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Redis exporter (if running redis_exporter sidecar)
  # Uncomment and add redis_exporter to docker-compose to enable:
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

# ── Alert Rules (optional) ─────────────────────────────────────
# rule_files:
#   - "alerts.yml"
